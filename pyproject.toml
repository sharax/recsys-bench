[project]
name = "recsys-bench"
version = "0.1.0"
description = "Classical recommendation, evaluated properly: temporal splits, full-catalog metrics, bootstrap intervals."
readme = "README.md"
authors = [{ name = "Sharath Dharmaji", email = "sharathdharmaji@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
